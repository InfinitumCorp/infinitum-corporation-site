<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SCALVS.ai Options</title>
  <link rel="stylesheet" href="shell.css" />
  <style>.app-main { max-width: 560px; }</style>
</head>
<body>
  <header class="app-bar">
    <span class="app-wordmark">SCALVS.ai<sup class="tm">™</sup></span>
  </header>
  <main class="app-main">
    <section class="section">
      <h2 class="label">SCALVS.ai address</h2>
      <p>The extension sends your questions to this SCALVS.ai deployment. The model key stays on that server; the extension holds no keys.</p>
      <form id="base-form">
        <div class="field">
          <label class="label" for="base">Address</label>
          <input class="input" id="base" type="text" inputmode="url" autocomplete="off" />
        </div>
        <div class="row">
          <button class="btn primary" type="submit">Save</button>
          <button class="btn" type="button" id="reset">Use default</button>
          <button class="btn" type="button" id="check">Check connection</button>
        </div>
      </form>
      <p class="small muted" id="result" aria-live="polite"></p>
    </section>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
